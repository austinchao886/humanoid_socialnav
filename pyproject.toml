[project]
name = "motion-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pexpect>=4.9"]

[project.scripts]
motion-service = "motion_pipeline.generator_service:main"
video-motion-service = "motion_pipeline.video_generator_service:main"
video-assets-check = "motion_pipeline.video_assets:main"
sonic-supervisor = "motion_pipeline.sonic_supervisor:main"
motion-cli = "motion_pipeline.cli:main"
motion-validate = "motion_pipeline.validator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["motion_pipeline*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
