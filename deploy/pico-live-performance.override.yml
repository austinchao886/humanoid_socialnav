# Optional diagnostics only: critical 200 Hz safety monitoring stays enabled.
# Append after existing deployment overlays. Applies to simulation runner only.
services:
  isaac-runner:
    environment:
      ISAAC_RUNNER_TRACE_HZ: "50"
      ISAAC_RUNNER_FOOT_CONTACT_TRACE: "0"
      ISAAC_RUNNER_ARM_GEOMETRY_TRACE: "0"
